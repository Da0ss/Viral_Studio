<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profile design QA</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#161616;color:#fff;font:13px Arial,sans-serif}.labels{height:42px;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:0 18px;color:#aaa;letter-spacing:.08em;text-transform:uppercase}.board{display:grid;grid-template-columns:1fr 1fr;gap:2px}.panel{position:relative;width:100%;aspect-ratio:1280/900;overflow:hidden;background:#f7f7f4}.panel img{display:block;width:100%;height:100%;object-fit:contain}.stage{position:absolute;inset:0;overflow:hidden}.stage iframe{width:1280px;height:900px;border:0;transform:scale(.5);transform-origin:top left;background:#f7f7f4}@media(max-width:1000px){.board{grid-template-columns:1fr}.labels{display:none}.stage iframe{transform:scale(calc(100vw / 1280))}.panel{aspect-ratio:1280/900}}
  </style>
</head>
<body>
  <div class="labels"><span>Исходный макет</span><span>Реализация</span></div>
  <main class="board">
    <section class="panel"><img src="./assets/qa/profile-reference.jpg" alt="Исходный экран профиля"></section>
    <section class="panel"><div class="stage"><iframe src="./#profile" title="Реализованный экран профиля"></iframe></div></section>
  </main>
</body>
</html>
